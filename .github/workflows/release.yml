name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create setup wizard zip
        run: |
          zip -r setup_wizard.zip setup_wizard
          mv setup_wizard.zip "Gacha_Blender_Setup-${{ github.ref_name }}.zip"

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: Gacha_Blender_Setup-${{ github.ref_name }}.zip
