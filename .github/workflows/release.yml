name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!*beta*'
      - '!*alpha*'
      - '!*rc*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch All Tags
        run: git fetch --tags --force

      - name: Generate Commit Changelog
        run: |
          python - << 'EOF'
          import os
          import subprocess

          current_tag = "${{ github.ref_name }}"
          # Find previous stable release tag (exclude pre-releases so the final release contains all changes since previous stable)
          res_prev = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0", "--exclude=*beta*", "--exclude=*alpha*", "--exclude=*rc*", f"{current_tag}^"],
              capture_output=True, text=True
          )
          prev_tag = res_prev.stdout.strip()
          if not prev_tag:
              res_prev_fallback = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", f"{current_tag}^"],
                  capture_output=True, text=True
              )
              prev_tag = res_prev_fallback.stdout.strip()

          if prev_tag:
              res_log = subprocess.run(
                  ["git", "log", f"{prev_tag}..{current_tag}", "--pretty=format:* %s (%h)", "--no-merges"],
                  capture_output=True, text=True, encoding="utf-8"
              )
              commits_text = res_log.stdout.strip()
          else:
              commits_text = ""

          if not commits_text:
              res_log = subprocess.run(
                  ["git", "log", "-n", "30", "--pretty=format:* %s (%h)", "--no-merges"],
                  capture_output=True, text=True, encoding="utf-8"
              )
              commits_text = res_log.stdout.strip()

          repo = os.environ.get("GITHUB_REPOSITORY", "PaoloESAN/gacha-setup")
          changelog_content = "## What's Changed\n\n" + commits_text
          if prev_tag:
              changelog_content += f"\n\n**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{current_tag}\n"

          with open("changelog.md", "w", encoding="utf-8") as f:
              f.write(changelog_content)
          EOF

      - name: Create setup wizard zip
        run: |
          zip -r setup_wizard.zip setup_wizard
          mv setup_wizard.zip "Gacha_Setup-${{ github.ref_name }}.zip"

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: changelog.md
          files: Gacha_Setup-${{ github.ref_name }}.zip
